name: Publish Main{Create} website

on:
  push:
    branches:
      - main
      - "design/**"
    paths:
      - "index.html"
      - "style.css"
      - "assets/**"
      - "CNAME"
      - "docs/**"
      - "scripts/build-site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: maincreate-public-pages
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  build:
    # Branch validation must not require the production github-pages environment.
    # Run the known build on the existing organization's self-hosted build runner.
    runs-on: [self-hosted, ci, linux-x64]
    timeout-minutes: 15
    steps:
      - name: Check out Main{Create} website
        uses: actions/checkout@v7

      - name: Validate and assemble site
        run: |
          python3 --version
          python3 scripts/build-site.py
          test -f _site/index.html
          test -f _site/docs/index.html
          test -f _site/assets/maincreate-braces-layers.svg
          test "$(cat _site/CNAME)" = "maincreate.com"

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: [self-hosted, ci, linux-x64]
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
